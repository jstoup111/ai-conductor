name: Live daemon E2E

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_credentials:
        description: Fail when the live-provider credential is unavailable.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-daemon-e2e:
    name: Live daemon E2E (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [claude]
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check live-provider credentials
        env:
          REQUIRE_CREDENTIALS: ${{ inputs.require_credentials }}
        run: |
          set -euo pipefail
          if [ "$REQUIRE_CREDENTIALS" = "true" ] && [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "Missing required secret: CLAUDE_CODE_OAUTH_TOKEN" >&2
            exit 1
          fi
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "### Live daemon E2E: claude credentialed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Live daemon E2E: claude skipped (CLAUDE_CODE_OAUTH_TOKEN is unavailable)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - name: Install smoke toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Install conductor dependencies
        run: npm ci
        working-directory: src/conductor
      - name: Build conductor
        run: npm run build
        working-directory: src/conductor
      - name: Run complete release smoke tier in gate mode
        run: npm run smoke
        working-directory: src/conductor
        env:
          SMOKE_MODE: ${{ inputs.require_credentials && 'gate' || 'advisory' }}
