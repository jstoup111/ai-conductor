name: Live daemon E2E

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      require_credentials:
        description: Retained compatibility input; each available live-provider credential enables its own gate-enforced leg.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  live-daemon-e2e:
    name: Live daemon E2E (${{ matrix.provider }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: claude
            credential_env: CLAUDE_CODE_OAUTH_TOKEN
            smoke_file: test/engine/daemon-e2e-live-claude.smoke.test.ts
          - provider: codex
            credential_env: CODEX_API_KEY
            smoke_file: test/engine/daemon-e2e-live-codex.smoke.test.ts
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check live-provider credentials
        env:
          LIVE_PROVIDER_CREDENTIAL: ${{ secrets[matrix.credential_env] }}
        run: |
          set -euo pipefail
          if [ -n "$LIVE_PROVIDER_CREDENTIAL" ]; then
            echo "### Live daemon E2E: ${{ matrix.provider }} gating run (${{ matrix.credential_env }} available)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Live daemon E2E: ${{ matrix.provider }} non-gating skip (${{ matrix.credential_env }} is unavailable)" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - name: Install smoke toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          npm install --global @anthropic-ai/claude-code @openai/codex
      - name: Install conductor dependencies
        run: npm ci
        working-directory: src/conductor
      - name: Build conductor
        run: npm run build
        working-directory: src/conductor
      - name: Run complete release smoke tier in gate mode
        env:
          CREDENTIAL_ENV: ${{ matrix.credential_env }}
          LIVE_PROVIDER_CREDENTIAL: ${{ secrets[matrix.credential_env] }}
        run: |
          if [ -z "$LIVE_PROVIDER_CREDENTIAL" ]; then
            exit 0
          fi
          env "$CREDENTIAL_ENV=$LIVE_PROVIDER_CREDENTIAL" SMOKE_MODE=gate npm run smoke -- "${{ matrix.smoke_file }}"
        working-directory: src/conductor
