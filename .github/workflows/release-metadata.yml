name: release-metadata

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read
  # write: the check also stamps the `semver:<impact>` band it just validated
  # onto the PR, so an operator can read merge order off the PR list.
  pull-requests: write

jobs:
  release-metadata:
    name: release-metadata
    # The generated release PR carries a candidate audit, not implementation
    # disposition fields. Its completeness is checked by release maintenance.
    if: github.event.pull_request.head.ref != 'automation/release-pr' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run build
        working-directory: src/conductor
      - uses: actions/github-script@v9
        with:
          script: |
            const { runReleaseMetadataCheckAction } = await import(`${process.env.GITHUB_WORKSPACE}/src/conductor/dist/index.js`);
            await runReleaseMetadataCheckAction({ github, context, core });
