name: release-metadata

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  release-metadata:
    name: release-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run build
        working-directory: src/conductor
      - uses: actions/github-script@v9
        with:
          script: |
            const { runReleaseMetadataCheckAction } = await import(`${process.env.GITHUB_WORKSPACE}/src/conductor/dist/index.js`);
            await runReleaseMetadataCheckAction({ github, context, core });
