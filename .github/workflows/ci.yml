name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docsonly.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: docsonly
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          docs_only=false
          if files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null) && [ -n "$files" ]; then
            docs_only=$(printf '%s\n' "$files" | bash .github/scripts/ci-detect-docs-only.sh | sed 's/^docs_only=//')
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  integrity:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installed explicitly so integrity checks 1b and 9d enforce here rather
      # than degrading to their "tool absent" paths on a runner image change.
      # A stalled Ubuntu mirror must not consume the workflow's six-hour ceiling.
      # Bound each external call and retry so a transient runner-network failure
      # does not prevent the repository checks from running.
      - name: Install integrity tooling
        run: |
          install_apt_packages() {
            # ShellCheck and ripgrep come from Ubuntu. Restrict the update to
            # that source so an unrelated preinstalled repository (for example
            # Chrome) with a transient bad index cannot block these checks.
            timeout --foreground --kill-after=10s 60s sudo apt-get \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-" \
              -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              "$@"
          }
          for attempt in 1 2 3; do
            if install_apt_packages update \
              && install_apt_packages install --yes shellcheck ripgrep; then
              exit 0
            fi
            echo "apt attempt $attempt/3 failed; retrying" >&2
            sleep 5
          done
          exit 1
      # The build-review rubric vocabulary/grammar guard (integrity check 25)
      # executes the engine's anchor parser via `node --import tsx`, so the
      # integrity job needs src/conductor's dependencies installed — without
      # them every probe invocation fails as "could not execute", which reads
      # as a guard failure rather than a missing tool.
      - uses: actions/setup-node@v5
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: bash test/test_harness_integrity.sh

  shellcheck:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep this independent gate resilient to the same transient mirror stalls.
      - name: Install ShellCheck
        run: |
          install_apt_packages() {
            # ShellCheck comes from Ubuntu. Restrict the update to that source
            # so an unrelated preinstalled repository cannot block this check.
            timeout --foreground --kill-after=10s 60s sudo apt-get \
              -o Dir::Etc::sourcelist="sources.list.d/ubuntu.sources" \
              -o Dir::Etc::sourceparts="-" \
              -o Acquire::Retries=0 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              "$@"
          }
          for attempt in 1 2 3; do
            if install_apt_packages update \
              && install_apt_packages install --yes shellcheck; then
              exit 0
            fi
            echo "apt attempt $attempt/3 failed; retrying" >&2
            sleep 5
          done
          exit 1
      # Same script integrity check 1b calls, so the two can never enforce
      # different file sets or severities.
      - run: bash test/lint_shell.sh

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run lint
        working-directory: src/conductor
      # Each plugins/<name>/ is its own TypeScript tree with its own
      # eslint.config.mjs sharing the engine's rules; lint it with the engine's
      # ESLint install (#1992). A plugin without a config fails here by design.
      - name: Lint plugins
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            (cd "$dir" && npm ci && ../../src/conductor/node_modules/.bin/eslint --max-warnings=0 "**/*.ts")
          done

  typecheck:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run typecheck
        working-directory: src/conductor
      # Type-checks test/ as well. Vitest transpiles without checking, so without
      # this a test can carry a type error indefinitely and still pass (#1015).
      - run: npm run typecheck:test
        working-directory: src/conductor
      # plugins/ is outside both conductor tsconfigs; each plugin carries its own
      # tsconfig.json and `typecheck` script (#1992).
      - name: Typecheck plugins
        run: |
          set -euo pipefail
          for dir in plugins/*/; do
            (cd "$dir" && npm ci && npm run typecheck)
          done

  conductor:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    # The aggregate Vitest suite normally completes in a few minutes, but its
    # filesystem-heavy local-Git fixtures can exceed the platform's short
    # default execution budget on a contended hosted runner. Keep a finite,
    # explicit ceiling rather than losing the test summary to that timeout.
    timeout-minutes: 15
    # Split the suite across runners by file. ci-gate reads needs.conductor.result,
    # which is failure when any shard fails. Workers per shard stay at the config's 2:
    # vitest.config.ts records 3 forks exceeding 28 GiB, and a hosted runner has 16 GB.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run build
        working-directory: src/conductor
      - run: npm test -- --shard=${{ matrix.shard }}/4
        working-directory: src/conductor

  # End-to-end tier (vitest.e2e.config.ts): real tmux sockets and whole-daemon
  # drives, excluded from the default suite so local and test_suite runs stay
  # fast. It still gates every PR through ci-gate.
  conductor-e2e:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: npm ci
        working-directory: src/conductor
      - run: npm run build
        working-directory: src/conductor
      - run: npm run test:e2e
        working-directory: src/conductor

  # DELIBERATELY UNGATED — no `if: docs_only != 'true'`.
  #
  # `docs_only` is true only when EVERY changed path is under `.docs/` (the internal
  # spec-artifact tree), per .github/scripts/ci-detect-docs-only.sh. Such a pull
  # request skips every other job in this file. A link checker carrying the same
  # gate would inherit that hole: the one class of PR that runs no checks at all
  # would also skip its links.
  #
  # Leaving it ungated also means the guarantee does not depend on how `docs_only`
  # is defined tomorrow — widen the predicate to cover `docs/` and this job keeps
  # running. It is cheap enough to always run: no npm install and no network,
  # roughly six seconds.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: lycheeverse/lychee-action@v2
        with:
          # Settings (offline-only, CHANGELOG.md excluded) live in lychee.toml.
          args: --config lychee.toml docs README.md AGENT_INSTRUCTIONS.md src/conductor/README.md
          fail: true

  ci-gate:
    needs: [changes, integrity, shellcheck, lint, typecheck, conductor, conductor-e2e, links]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          INTEGRITY: ${{ needs.integrity.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          CONDUCTOR: ${{ needs.conductor.result }}
          CONDUCTOR_E2E: ${{ needs.conductor-e2e.result }}
          LINKS: ${{ needs.links.result }}
        run: |
          summary="changes=$CHANGES integrity=$INTEGRITY shellcheck=$SHELLCHECK lint=$LINT typecheck=$TYPECHECK conductor=$CONDUCTOR conductor_e2e=$CONDUCTOR_E2E links=$LINKS"
          for r in "$CHANGES" "$INTEGRITY" "$SHELLCHECK" "$LINT" "$TYPECHECK" "$CONDUCTOR" "$CONDUCTOR_E2E" "$LINKS"; do
            case "$r" in
              failure|cancelled)
                echo "CI gate failed: $summary" >&2
                exit 1 ;;
            esac
          done
          echo "CI gate satisfied ($summary)"
