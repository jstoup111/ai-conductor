name: ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.docsonly.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: docsonly
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          docs_only=false
          if files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" 2>/dev/null) && [ -n "$files" ]; then
            docs_only=$(printf '%s\n' "$files" | bash .github/scripts/ci-detect-docs-only.sh | sed 's/^docs_only=//')
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  integrity:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installed explicitly so integrity check 1b enforces here rather than
      # degrading to its "tool absent" WARN path on a runner image change.
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: bash test/test_harness_integrity.sh

  shellcheck:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      # Same script integrity check 1b calls, so the two can never enforce
      # different file sets or severities.
      - run: bash test/lint_shell.sh

  lint:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run lint
        working-directory: src/conductor

  typecheck:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run typecheck
        working-directory: src/conductor
      # Type-checks test/ as well. Vitest transpiles without checking, so without
      # this a test can carry a type error indefinitely and still pass (#1015).
      - run: npm run typecheck:test
        working-directory: src/conductor

  conductor:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: src/conductor/.tool-versions
          cache: npm
          cache-dependency-path: src/conductor/package-lock.json
      - run: npm ci
        working-directory: src/conductor
      - run: npm run build
        working-directory: src/conductor
      - run: npm test
        working-directory: src/conductor

  # DELIBERATELY UNGATED — no `if: docs_only != 'true'`.
  #
  # Every other job here is skipped on a docs-only PR. A docs link checker wired
  # that way would be skipped on exactly the pull requests that can break links,
  # and would only ever run on the ones that cannot. So this job runs on both
  # paths; it is cheap (no npm install, no network) and its inputs are docs.
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Settings (offline-only, CHANGELOG.md excluded) live in lychee.toml.
          args: --config lychee.toml docs README.md AGENT_INSTRUCTIONS.md src/conductor/README.md
          fail: true

  ci-gate:
    needs: [changes, integrity, shellcheck, lint, typecheck, conductor, links]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          INTEGRITY: ${{ needs.integrity.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          CONDUCTOR: ${{ needs.conductor.result }}
          LINKS: ${{ needs.links.result }}
        run: |
          summary="changes=$CHANGES integrity=$INTEGRITY shellcheck=$SHELLCHECK lint=$LINT typecheck=$TYPECHECK conductor=$CONDUCTOR links=$LINKS"
          for r in "$CHANGES" "$INTEGRITY" "$SHELLCHECK" "$LINT" "$TYPECHECK" "$CONDUCTOR" "$LINKS"; do
            case "$r" in
              failure|cancelled)
                echo "CI gate failed: $summary" >&2
                exit 1 ;;
            esac
          done
          echo "CI gate satisfied ($summary)"
