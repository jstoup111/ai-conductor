# ai-conductor project configuration
# See the harness config schema (src/conductor/src/types/config.ts) for all keys.

# Auto-reconciliation of parked features, explicitly enabled (operator order,
# 2026-07-30, matches the documented default but pinned here so it survives
# regardless of a future default change). A merged parked slug with a
# shipped-record on origin/main (or branch ancestry into it) is cleaned up
# automatically: worktree removed, branch deleted, unparked.
reconcile_parked_auto_cleanup: true

# Self-host guardrails: declared version freeze (PR #262).
#
# VERSION is frozen at 0.100.0 until the operator declares 1.0 (v1.0 cutover
# program, issue #228). With the freeze declared here, the daemon's self-host
# VERSION approval gate self-satisfies when the worktree VERSION still equals
# the frozen value — no per-feature HALT + manual .pipeline/version-approval
# round-trip. A feature that ACTUALLY bumps VERSION still halts for approval.
# Read at daemon startup; restart the daemon to apply. Remove this key when
# cutting 1.0.
#
# `latest` tracks the resolved base branch's VERSION rather than pinning a
# literal, so a bot-owned release no longer leaves every self-host build
# halting on a stale freeze until an operator bumps this by hand. Resolution
# is fail-closed: any git/network failure resolves to no freeze and the gate
# falls through to signal classification exactly as if none were declared.
harness_self_host:
  version_freeze: latest

# Stale-engine auto-restart (issue #256, PR #307). When the idle daemon detects
# that dist points at a newer engine than the one it is running (after a local
# rebuild — bin/install or npm run build), it respawns in place: restart marker
# → lock release → same-tmux-session respawn. Default-inert engine-side; armed
# here. Read at daemon startup; restart once to apply.
auto_restart_on_stale_engine: true

# Spot-audit sampling percentage (telemetry only; inert now the judge cutover is retired,
# kept for when attribution telemetry is consumed).
attribution_audit_sample_pct: 10

# Progress-aware build halt/park. Disabled 2026-07-22 (#773): the no_task_progress
# park fires on the very trailer-corroboration wedges #773 removes, halting otherwise-
# healthy builds. enabled:false stops the park (attempt/wall-clock retry bounds still apply).
build_progress_halt:
  enabled: true

# Per-rubric build-review routing: the judgement-heavy pair runs on Claude
# opus, the mechanical pair on Codex, halving review load per provider and
# putting counterfactual/plan-holistic judgement on the strongest reasoner.
# rootCause inherits the engine's medium-effort default (narrowest rubric).
build_review:
  # Enable this repository's advisory containment recordings. The shipped
  # default remains false, so consumer repositories must opt in explicitly.
  scopeContainmentEnforced: true
  rubrics:
    # test-quality is the only rubric this container dispatches. The rubrics it
    # replaced — scope, completeness, rootCause, tautology — are retired and
    # unregistered: prd_audit now owns scope-as-intent grading with bounded
    # remediation, and the as-built architecture review owns design conformance,
    # both running on every feature regardless of tier or track.
    #
    # No retired key is declared here. A consumer config that still names one
    # loads as a no-op with a one-time notice (FR-20) rather than failing.
    testQuality:
      enabled: true
      llm_provider: claude
      model: opus
      effort: high

# Native pre-SHIP aggregate verification. The project-owned npm script runs
# Vitest's test/**/*.test.ts inclusion, covering ordinary and acceptance tests
# in one operation. Harness integrity remains a separate self-host gate.
test_suite:
  command: npm test
  # The detached counterfactual checkout materializes this ignored dependency
  # installation at its root before the scoped command runs.
  scoped_command: './node_modules/.bin/vitest run {selectors}'
  working_directory: src/conductor
  timeout_seconds: 1800
  # One full-suite run per feature, then hold that PASS across small laps.
  #
  # `aggregate` stays the mode deliberately. `scoped` derives its selectors
  # from the feature's changed *test* paths only, so a source change that
  # breaks an untouched test would not be executed by the build loop's only
  # regression gate.
  #
  # The budget is a count of changed files since the attested PASS, per
  # category. Within budget the PASS is preserved and nothing re-runs; over
  # it, the aggregate command runs again and re-attests. The v1.0 cutover
  # build dispatched `test_suite` five times at ~4m20s each — roughly 22
  # minutes — while its individual commits touched 1-2 files, occasionally
  # 5-7. Six holds the PASS across an ordinary remediation lap and re-attests
  # on a large one.
  #
  # `source` is the catch-all classification, so `docs/`, `.docs/`, `bin/`,
  # `skills/`, and `HARNESS.md` churn in the SHIP tail counts against it
  # exactly as engine code does; the budget cannot tell them apart. Left
  # undeclared, `dependencies`, `environment`, `migrations`, and
  # `project_config` remain `none` — those are unbudgetable and always
  # re-run.
  verification:
    mode: aggregate
    drift_budget:
      source: 6
      tests: 3

# Per-step overrides.
#
# manual_test is disabled for this repo's self-host builds (operator order,
# 2026-07-13). The harness's own features are engine/CLI changes covered by
# vitest + the integrity suite; a dispatched manual-test session adds cost
# without signal here. The step is marked `skipped`, which satisfies the
# downstream prerequisites (prd_audit, rebase) and the SHIP-tail selector —
# the pipeline flows build → build_review (opt-in, currently off) → prd_audit
# (skipped on technical track) → architecture_review_as_built → rebase →
# maintain-documentation → release-disposition → finish. manual_test is the only gating step whose
# definition opts into config-disable (`configDisableAllowed`); structural steps can never be
# disabled. Read per conduct run; new builds pick it up once the engine
# supporting `configDisableAllowed` is deployed (rebuild + daemon reload) —
# an OLDER engine rejects this key as "Cannot disable gating step".
llm_provider: [codex, claude]

conflict_check:
  adr_corpus: repo_wide

# Remediation append allowance. The effective cap is
# min(max_appended_tasks, floor(authored_count * max_appended_ratio)), so BOTH
# terms bind: raising only the fixed cap leaves a small plan pinned by the ratio.
#
# Raised from the 5 / 0.25 defaults on 2026-09-02. Two features were halting a
# task or three over an allowance that, on plans of 15 and 24 authored tasks,
# resolved to 4 and 5 — small enough that an ordinary as-built round could not
# fit inside it. The cap exists to stop a plan being rewritten by remediation
# rather than re-planned; at 8 it still does that, and a feature needing 26
# appended tasks against a 19-task plan (the case that prompted this review)
# remains far outside it and still halts for an operator.
prd_audit:
  max_appended_tasks: 8
  max_appended_ratio: 0.5

steps:
  explore:
    llm_provider: claude
  prd:
    llm_provider: claude
  architecture_review:
    llm_provider: claude
  conflict_check:
    llm_provider: claude
  coherence_check:
    llm_provider: codex
  prd_audit:
    llm_provider: claude
  # Routed to codex 2026-08-24. Of the two as-built judgement gates this is
  # the safer one to move: it emits a single verdict plus rationale, so it
  # cannot produce the malformed-table "mechanical fault" halt that
  # prd_audit's 40-row Verdict Table already caused twice; and its contract
  # surface is narrower — approved ADRs against the diff, rather than plan
  # tasks + story criteria + scope trailers + intent relations. A wrong
  # BLOCKED is loud and lands in front of the operator. `prd_audit`
  # deliberately stays on claude.
  architecture_review_as_built:
    llm_provider: codex
  # Pinned to claude (operator order, 2026-08-10), reverting #1471. Conflict
  # resolution was rerouted to codex on the theory that it is mechanical
  # pattern-matching; in practice codex does not resolve rebases acceptably, so
  # the cost argument does not apply. The HALT-on-failure and protected-artifact
  # seal remain true but catch only the resolutions that fail loudly.
  rebase:
    llm_provider: claude
  # Routed to codex 2026-08-23, after PR #1828 granted the codex sandbox
  # network egress. The claude pin existed because `gh pr create` had to escape
  # the sandbox and lost the auto_review approval — a permissions limit, not a
  # capability one. Revert this pin if publication quality regresses.
  # Back on codex 2026-08-24 with `release-disposition`, same root cause and
  # same fix. `gh` egress under the workspace-write sandbox was granted by
  # PR #1828, so the original reason for the claude pin is also gone.
  finish:
    llm_provider: codex
  manual_test:
    disable: true
  # build stays on the codex `terra` default at medium effort. A bump to `sol`
  # was considered and dropped 2026-08-23: there is no control group showing
  # the builder is the limiter (codex built 28/28 corpus features), the
  # findings-per-lap rate is flat, and `escalate` already climbs build to
  # sol/high on retry when a task actually needs it (18 such escalations in
  # the corpus). Revisit alongside #1805 rather than as a blind bump.
  # Remediate decides what work a failing lap actually gets, across laps. That
  # is a judgement call over plan contract + prior-lap findings, so pin it to
  # claude rather than letting the run-level codex entry resolve first.
  remediate:
    llm_provider: claude
  # Routed to codex 2026-08-24. The claude pin carried no recorded rationale;
  # this is a bounded docs-conformance pass with a completion artifact, and a
  # wrong answer costs a stale docs page rather than a bad gate verdict.
  maintain-documentation:
    llm_provider: codex
    model: gpt-5.6-terra
    after: rebase
    skill: .agents/skills/maintain-documentation/SKILL.md
    enforcement: gating
    completion_artifact: .pipeline/maintain-documentation-pass
  # Routed to codex 2026-08-23 (was pinned to claude ahead of the run-level
  # codex entry, #1285). Same rationale as `finish`: the failure was `gh`
  # egress under the workspace-write sandbox, fixed by PR #1828. The output is
  # a fixed-grammar Release-* block validated by a required CI check that fails
  # closed, so a wrong answer is caught rather than shipped.
  # Back on codex 2026-08-24 once the root cause shipped: the streaming
  # dispatch path rebuilt each ProviderRuntime with a hand-listed `provider`
  # literal, dropping `resolveSelfHostExecutable`, so every codex-routed
  # streaming step threw at conductor.ts:3961 before the provider existed.
  # step-runners.ts now delegates to the real adapter. Original rationale
  # stands: the output is a fixed-grammar Release-* block validated by a
  # required CI check that fails closed, so a wrong answer is caught.
  release-disposition:
    llm_provider: codex
    model: gpt-5.6-terra
    after: maintain-documentation
    skill: .agents/skills/release-disposition/SKILL.md
    enforcement: gating
    completion_artifact: .pipeline/release-disposition-pass
