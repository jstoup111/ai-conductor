# Project config — <repo>/.ai-conductor/config.yml
# Controls: harness_version compatibility with the installed harness.
# Allowed: a satisfiable semver range.
# Default: >=0.99.0.
# Changing it: raises or narrows the required harness release.
harness_version: ">=0.99.0"

# Controls: build_review.rubrics.testQuality.enabled, whether build review evaluates changed tests.
# Allowed: true or false.
# Default: false.
# Changing it: enable only after configuring a supported scoped test command below.
build_review:
  adjudication:
    enabled: true
  rubrics:
    testQuality:
      enabled: false

# Controls: test_suite.working_directory, the working directory used before test commands run.
# Allowed: a project-relative directory.
# Default: `.`.
# Changing it: point it at a subproject when the authoritative suite lives there.
# Controls: test_suite.timeout_seconds, the maximum test-suite runtime in seconds.
# Allowed: a positive integer.
# Default: 1800.
# Changing it: raise it only for a suite whose normal runtime needs more time.
# test_suite:
#   command: npm test
#   working_directory: .
#   timeout_seconds: 1800
#   # Controls: test_suite.inputs, files included when calculating scoped-test drift.
#   # Allowed: project-relative paths.
#   # Default: none.
#   # Changing it: adds authoritative inputs outside the ordinary source tree.
#   inputs: []
#   # Controls: test_suite.scoped_command, the command used to run selected tests.
#   # Allowed: one project-owned command containing `{selectors}`.
#   # Default: unset.
#   # Changing it: enables scoped verification instead of the aggregate command.
#   scoped_command: npm test -- {selectors}

# Test-suite verification answer recorded by ai-conductor config init.
test_suite:
  command: npm test
  verification:
    mode: aggregate
    drift_budget:
      additional_inputs: none
      source: none
      test_infrastructure: none
      tests: none

# Controls: otel.worker_name, the OpenTelemetry worker identity.
# Allowed: a non-empty worker name.
# Default: this machine's hostname.
# Changing it: gives CI or shared workers a stable trace identity.
# otel:
#   worker_name: ci-worker-1

# Controls: steps.<name>.model, the model selected for an individual lifecycle step.
# Allowed: a routed model identifier.
# Default: the harness routing default.
# Changing it: overrides model selection for that step.
# Controls: steps.<name>.effort, the reasoning effort selected for an individual lifecycle step.
# Allowed: low, medium, high, xhigh, or max.
# Default: the harness routing default.
# Changing it: overrides effort for that step.
# --- Per-step overrides (optional) -------------------------------------------
# steps:
#   explore:
#     model: haiku
#     effort: low
